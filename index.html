<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forever Valentine ❤️</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
    position: relative;
}

.bg-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.25);
    z-index: 1;
}

.box {
    background: rgba(255,255,255,0.95);
    padding: 35px 45px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    position: relative;
    z-index: 2;
    animation: fadeIn 1.5s ease;
    max-width: 420px;
}

.main-image {
    width: 180px;
    border-radius: 12px;
    margin-bottom: 15px;
}

@keyframes fadeIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
}

h1 {
    color: #ff3366;
    margin-top: 0;
}

p {
    font-size: 18px;
    color: #555;
}

.buttons {
    margin-top: 30px;
    position: relative;
    height: 60px;
}

button {
    padding: 14px 32px;
    font-size: 17px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    transition: 0.3s;
}

#yes {
    background: linear-gradient(135deg, #ff3366, #ff758c);
    color: white;
    box-shadow: 0 8px 20px rgba(255,51,102,0.4);
    margin-right: 20px;
}

#yes:hover {
    transform: scale(1.08);
}

#no {
    background: #eee;
    color: #333;
    position: absolute;
}

.heart {
    position: absolute;
    font-size: 26px;
    animation: float 5s ease-in forwards;
    z-index: 3;
}

@keyframes float {
    0% {
        transform: translateY(0) scale(1);
        opacity: 1;
    }
    100% {
        transform: translateY(-350px) scale(1.8);
        opacity: 0;
    }
}
</style>
</head>

<body>

<video id="bgVideo" class="bg-video" autoplay muted loop playsinline preload="auto">
    <source src="bgvideo.mp4" type="video/mp4">
</video>

<div class="box">
    <img src="im1.jpg" alt="Love" class="main-image">

    <h1>Will You Be My Valentine? ❤️</h1>

    <p>
    
        From the moment you came into my life,<br>
        everything felt a little more beautiful
    </p>

    <div class="buttons">
        <button id="yes" onclick="yesClicked()">YES 💖</button>
        <button id="no">NO 🙈</button>
    </div>
</div>

<script>
const video = document.getElementById("bgVideo");
const noBtn = document.getElementById("no");

// video starts immediately when page loads
window.addEventListener("load", function () {
    video.play().catch(function(err) {
        console.log(err);
    });
});

// first click anywhere turns sound on
document.addEventListener("click", function enableSound() {
    video.muted = false;
    video.volume = 1;
    video.play().catch(function(err) {
        console.log(err);
    });

    document.removeEventListener("click", enableSound);
});

noBtn.addEventListener("mouseover", moveNo);
noBtn.addEventListener("click", moveNo);

function moveNo() {
    const x = Math.random() * 260 - 130;
    const y = Math.random() * 160 - 80;
    noBtn.style.transform = `translate(${x}px, ${y}px)`;
}

function yesClicked() {
    document.querySelector(".box").innerHTML = `
        <img src="im1.jpg" alt="Love" style="width:180px;border-radius:12px;margin-bottom:15px;">
        <h1>She Said YES 😍💖</h1>
        <p>
            I promise to love you, respect you,<br>
            and make you smile every single day 😘🌹
        </p>
    `;

    setInterval(createHeart, 180);
}

function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.top = "80vh";
    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 5000);
}
</script>

</body>
</html>
